name: CI/CD — Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}

jobs:
  # ── Job 1: Lint & Test ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Compile-check backend
        run: python -m compileall backend/app -q

      - name: Run backend smoke test
        run: python test_smoke.py

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  # ── Job 2: Build & Push Docker Images ──────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    # CI still passes without cloud credentials. Deployment only runs after
    # workload identity has been configured as described in DEPLOYMENT.md.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != '' && vars.GKE_CLUSTER != '' && vars.GKE_ZONE != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build backend image
        run: |
          docker build -t gcr.io/$PROJECT_ID/healthwatch-backend:${{ github.sha }} \
                        -t gcr.io/$PROJECT_ID/healthwatch-backend:latest \
                        -f backend/Dockerfile .

      - name: Build frontend image
        run: |
          docker build -t gcr.io/$PROJECT_ID/healthwatch-frontend:${{ github.sha }} \
                        -t gcr.io/$PROJECT_ID/healthwatch-frontend:latest \
                        -f frontend/Dockerfile .

      - name: Push images
        run: |
          docker push gcr.io/$PROJECT_ID/healthwatch-backend:latest
          docker push gcr.io/$PROJECT_ID/healthwatch-backend:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/healthwatch-frontend:latest
          docker push gcr.io/$PROJECT_ID/healthwatch-frontend:${{ github.sha }}

  # ── Job 3: Deploy to GKE ───────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != '' && vars.GKE_CLUSTER != '' && vars.GKE_ZONE != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: $GKE_CLUSTER
          location: $GKE_ZONE

      - name: Deploy to GKE
        run: |
          # Update image tags in manifests
          sed -i "s|gcr.io/PROJECT_ID/healthwatch-backend:latest|gcr.io/$PROJECT_ID/healthwatch-backend:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|gcr.io/PROJECT_ID/healthwatch-frontend:latest|gcr.io/$PROJECT_ID/healthwatch-frontend:${{ github.sha }}|g" k8s/frontend-deployment.yaml

          # Apply all manifests
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl get secret healthwatch-secrets -n healthwatch
          kubectl apply -f k8s/services.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/backend-hpa.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/healthwatch-backend -n healthwatch --timeout=300s
          kubectl rollout status deployment/healthwatch-frontend -n healthwatch --timeout=120s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n healthwatch
          echo "=== Services ==="
          kubectl get svc -n healthwatch
          echo "=== HPA ==="
          kubectl get hpa -n healthwatch
          echo "=== Ingress ==="
          kubectl get ingress -n healthwatch
