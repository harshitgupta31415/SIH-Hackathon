apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthwatch-frontend
  namespace: healthwatch
  labels:
    app: healthwatch-frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthwatch-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: healthwatch-frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: gcr.io/PROJECT_ID/healthwatch-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
