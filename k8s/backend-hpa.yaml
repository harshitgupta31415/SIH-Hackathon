apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthwatch-backend-hpa
  namespace: healthwatch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthwatch-backend
  minReplicas: 2
  maxReplicas: 12               # Scales to 12 pods under sustained load
  metrics:
    # Scale on CPU (primary)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale on memory (secondary)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3               # Add up to 3 pods per scale-up
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # 5 min cooldown before removing pods
      policies:
        - type: Pods
          value: 1               # Remove max 1 pod per 5 min
          periodSeconds: 300
