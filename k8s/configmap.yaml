apiVersion: v1
kind: ConfigMap
metadata:
  name: healthwatch-config
  namespace: healthwatch
data:
  # PostgreSQL (Cloud SQL Proxy in production)
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/healthwatch"
  REDIS_URL: "redis://redis:6379/0"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRY_MINUTES: "1440"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "30"
  CACHE_TTL: "300"
  CACHE_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_WINDOW: "60"
  CORS_ORIGINS: '["http://localhost","http://localhost:80","https://healthwatch.gov.in"]'
