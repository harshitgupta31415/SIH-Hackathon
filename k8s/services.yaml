---
# Backend Service (ClusterIP for internal routing via Nginx)
apiVersion: v1
kind: Service
metadata:
  name: healthwatch-backend
  namespace: healthwatch
  labels:
    app: healthwatch-backend
spec:
  type: ClusterIP
  selector:
    app: healthwatch-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
# Frontend Service (ClusterIP; Ingress exposes it)
apiVersion: v1
kind: Service
metadata:
  name: healthwatch-frontend
  namespace: healthwatch
  labels:
    app: healthwatch-frontend
spec:
  type: ClusterIP
  selector:
    app: healthwatch-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
