apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthwatch-backend
  namespace: healthwatch
  labels:
    app: healthwatch-backend
    tier: api
spec:
  replicas: 2                    # Start with 2; HPA will scale to 10+
  selector:
    matchLabels:
      app: healthwatch-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # Zero-downtime deploys
  template:
    metadata:
      labels:
        app: healthwatch-backend
        tier: api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: gcr.io/PROJECT_ID/healthwatch-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: healthwatch-config
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: healthwatch-secrets
                  key: JWT_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: healthwatch-config
                  key: DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # 60s max startup time
