steps:
  # ── Build Backend Image ──────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/healthwatch-backend:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/healthwatch-backend:latest', '-f', 'backend/Dockerfile', '.']

  # ── Build Frontend Image ────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/healthwatch-frontend:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/healthwatch-frontend:latest', '-f', 'frontend/Dockerfile', '.']

  # ── Push both images ────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/healthwatch-backend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/healthwatch-frontend']

  # ── Deploy to GKE ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - --filename=k8s/
      - --location=$REGION
      - --cluster=healthwatch-cluster
      - --image=gcr.io/$PROJECT_ID/healthwatch-backend:$SHORT_SHA
      - --image=gcr.io/$PROJECT_ID/healthwatch-frontend:$SHORT_SHA

timeout: 900s
options:
  machineType: 'E2_HIGHCPU_8'
