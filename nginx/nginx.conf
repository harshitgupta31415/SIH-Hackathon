worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ── Basic ────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # ── Gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml;

    # ── Rate Limiting (per IP, shared memory zone) ──────────────────
    # 10 MB shared zone ≈ handles ~160k unique IPs
    limit_req_zone $binary_remote_addr zone=api_auth:10m  rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_write:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_read:10m  rate=30r/s;

    # ── Upstreams (round-robin across N backend pods) ────────────────
    upstream backend {
        least_conn;
        server backend:8000;
        # Add more replicas here for horizontal scaling:
        # server backend-2:8000;
        # server backend-3:8000;
        keepalive 32;
    }

    # ── Proxy defaults ──────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    10s;

    # ── Logging ─────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Server ──────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health endpoints (bypass rate limit)
        location = /api/health {
            proxy_pass http://backend;
        }
        location = /api/ready {
            proxy_pass http://backend;
        }

        # Auth endpoints (strict rate limit)
        location /api/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://backend;
        }

        # Write endpoints (moderate rate limit)
        location ~ ^/api/(reports|water-quality|alerts)(/|$) {
            limit_req zone=api_write burst=20 nodelay;
            proxy_pass http://backend;
        }

        # All other API (read-heavy, generous limit)
        location /api/ {
            limit_req zone=api_read burst=50 nodelay;
            proxy_pass http://backend;
        }

        # Static frontend assets (served from nginx, no backend needed)
        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # SPA fallback: serve index.html for all non-API routes
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Static assets caching
            location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # Security headers
        add_header X-Frame-Options       "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }
}
